name: Build Location Finder APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Generate SHA fingerprints
        run: gradle :app:signingReport --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LocationFinder-APK
          path: app/build/outputs/apk/debug/app-debug.apk
