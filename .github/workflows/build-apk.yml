name: Build Location Finder APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/build-and-consent-flow

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Generate SHA fingerprints
        run: gradle :app:signingReport --no-daemon

      - name: Prepare APK download file
        run: cp app/build/outputs/apk/debug/app-debug.apk LocationFinder.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocationFinder-APK
          path: LocationFinder.apk

      - name: Publish permanent APK download
        if: github.ref == 'refs/heads/fix/build-and-consent-flow'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: download-latest
          name: LocationFinder Latest APK
          make_latest: true
          overwrite_files: true
          files: LocationFinder.apk
